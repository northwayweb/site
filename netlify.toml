[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'sha256-HaUlrz1aG8rysvQIUH2ual6nBXp+aEEm8lpdyyUYJbQ=' 'sha256-k/Ar/T0gW+R00FcwPShoddyBWXXQEHeqZEzgW9b5imM='; connect-src 'self'; form-action 'self'; report-uri /.netlify/functions/csp-report"

[[redirects]]
  from = "https://northwayweb.netlify.app/*"
  to = "https://northwayweb.ca/:splat"
  status = 301
  force = true
