<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Thank You | Northway Web</title>
  <link rel="stylesheet" href="css/styles.css?v=20260129-01" />
</head>
<body class="thanks-page">

  <header class="hero">
    <nav class="top-nav">
      <a href="/" class="brand-logo">Northway Web</a>
    </nav>

    <div class="container">
      <h1>Thank you! <span class="thanks-flower" aria-hidden="true">🌸</span></h1>
      <p class="supporting">
        Your message has been received. We will get back to you shortly.
      </p>
      <p class="supporting" id="thanks-note" style="display:none;"></p>
      <div class="thanks-actions">
        <a href="/#contact" class="cta-primary">Send another message</a>
        <a href="/" class="cta-secondary">Back to home</a>
      </div>
    </div>
  </header>

  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer-brand">Northway Web</div>
      <div class="footer-tagline">
        Building websites that help local businesses grow
      </div>
      <div class="footer-contact">Email: support@northwayweb.ca</div>
      <div class="footer-location">
        © <span id="year"></span> Northway Web. All rights reserved.
      </div>
    </div>
  </footer>

  <script>
    (function () {
      function safeRedirect(url) {
        try {
          window.location.assign(url);
        } catch (e) {
          window.location.href = url;
        }
      }

      function init() {
        var params = new URLSearchParams(window.location.search);
        var submitted = params.get('submitted') === '1';
        var note = document.getElementById('thanks-note');
        var title = document.querySelector('.thanks-page h1');
        var supporting = document.querySelector('.thanks-page .supporting');

        if (!submitted) {
          if (title) title.textContent = 'You’re in the right place';
          if (supporting) supporting.textContent = 'Please use the contact form to send a message.';
          if (note) {
            note.style.display = 'block';
            note.textContent = 'Redirecting you to the contact section…';
          }
          window.setTimeout(function () {
            safeRedirect('/#contact');
          }, 2200);
          return;
        }

        try {
          sessionStorage.removeItem('nw_contact_draft_v1');
        } catch (e) {
          // ignore
        }

        if (note) {
          note.style.display = 'block';
          note.textContent = 'Redirecting you back in a few seconds…';
        }
        window.setTimeout(function () {
          safeRedirect('/');
        }, 8000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

  <script src="js/main.js?v=20260128-12"></script>
</body>
</html>
