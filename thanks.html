<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Thank You | Northway Web</title>
  <link rel="icon" type="image/png" href="/assets/northway-logo.png" />
  <link rel="apple-touch-icon" href="/assets/northway-logo.png" />
  <link rel="stylesheet" href="css/styles.css?v=20260130-06" />
</head>
<body class="thanks-page">

  <header class="hero">
    <nav class="top-nav">
      <a href="/" class="brand-logo" aria-label="Northway Web">
        <span class="brand-wordmark" aria-hidden="true">
          <span>Northway</span>
          <span class="wm-dot"></span>
          <span class="wm-accent">Web</span>
        </span>
        <span class="visually-hidden">Northway Web</span>
      </a>
    </nav>

    <div class="container">
      <h1>Thank you! <span class="thanks-emoji" aria-hidden="true">😊</span></h1>
      <p class="supporting">
        Your message has been received. We will get back to you shortly.
      </p>
      <p class="supporting" id="thanks-note" style="display:none;"></p>
      <div class="thanks-actions">
        <a href="/#contact" class="cta-primary">Send another message</a>
        <a href="/" class="cta-secondary">Back to home</a>
      </div>
    </div>
  </header>

  <footer class="footer" id="footer">
    <div class="container">
      <div class="foot">
        <div class="foot-left">
          <div class="footer-brand">Northway Web</div>
          <div class="footer-tagline">
            Building websites that help local businesses grow
          </div>
        </div>

        <div class="foot-right">
          <div class="footer-contact">Email: support@northwayweb.ca</div>
          <div class="footer-location">
            © <span id="year"></span> Northway Web. All rights reserved.
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js?v=20260130-04"></script>
</body>
</html>
